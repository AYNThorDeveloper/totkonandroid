name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publication boundary
        run: python3 tools/publication_guard.py
      - name: Exercise read-only RomFS backend with synthetic inputs
        run: python3 android/test_romfs.py
      - name: Exercise graphics settings with synthetic inputs
        run: bash android/test_graphics_settings.sh
